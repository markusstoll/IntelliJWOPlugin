plugins {
    id("org.jetbrains.intellij.platform") version "2.19.0"
    id("java")
    id("idea")
}

group = 'de.junidas.webobjects.ijplugin'
version = '0.10.2'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
        snapshots()
    }
}

sourceSets {
    main {
        java {
            srcDirs("src/main/gen")
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def platformVersion = providers.gradleProperty("intellijVersion").orElse("2026.2.4")

dependencies {
    // IntelliJ Platform + zusätzliche Plugins
    intellijPlatform {
        intellijIdea(platformVersion) {
            useInstaller = false
        }
        bundledPlugin("com.intellij.java")
        bundledModule("intellij.java.execution")
        bundledModule("intellij.java.execution.impl")
        bundledPlugin("org.jetbrains.idea.maven")

        // Test Framework (bringt JUnit 4 + IntelliJ-Test-Infrastruktur)
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }

    // Weitere Dependencies
    implementation("org.jetbrains:annotations:24.0.0")
    implementation("org.apache.commons:commons-lang3:3.18.0")
    implementation("org.seleniumhq.selenium:htmlunit3-driver:4.9.1")

    // JUnit Platform Launcher – nötig für Gradle Test-Executor
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
    testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.10.0")

    // JUnit 5
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    // JUnit 4 (nur für @Rule-Schnittstelle und ParsingTestCase)
    testImplementation("junit:junit:4.13.2")
    // Mockito für Unit-Tests
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

test {
    // JUnit 5 Test-Runner aktivieren
    useJUnitPlatform()
}
