name: Build Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build plugin
        run: ./gradlew test composedJar

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: IntelliJWOPlugin
          path: |
            build/libs/IntelliJWOPlugin-*.jar
            !build/libs/*-base.jar
            !build/libs/*-instrumented.jar
          retention-days: 30

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
          retention-days: 14
